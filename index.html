<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUILT V1.2</title>
<style>
body{margin:0;background:#f5f5f3;color:#111;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 18px 90px}.logo{font-size:28px;font-weight:900;margin-bottom:18px}.logo i{color:#7440d8}h1{margin:5px 0 6px}h2,h3{margin:4px 0}.muted{color:#777}.card,.item,.week{background:white;border:1px solid #e5e5e1;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fafafa;padding:12px;border-radius:12px}.stat b{font-size:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#111;color:white;font-weight:700}.p{background:#7440d8}.light{background:#eeeaf8;color:#5d31b4}.wide{width:100%;margin-top:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd}.navin{max-width:760px;margin:auto;display:flex}.nav button{flex:1;border:0;background:none;padding:9px 2px;color:#777}.nav .on{color:#7440d8;font-weight:800}.nav span{display:block;font-size:18px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:10px;margin:4px 0 8px;font:inherit}.editor{border:1px solid #ddd;border-radius:12px;padding:10px;margin:8px 0;background:#fafafa}.ex{display:grid;grid-template-columns:1.5fr .5fr .7fr .7fr auto;gap:5px}.chart{height:230px;background:#fafafa;border:1px solid #ddd;border-radius:13px}.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:94vh;overflow:auto}
</style><body><div class="app"><div class="logo">BUILT<i>.</i></div><main id="main"></main></div><div class="nav"><div class="navin" id="nav"></div></div>
<script>
const seed={clients:[{id:1,name:"Emma",weight:82.4,goal:78,waist:86,goalWaist:80,weights:[84.2,83.7,83.1,82.8,82.4,81.9,81.6],waists:[89,88,87.5,87,86.8,86.2,86],adherence:92,programs:[]}],programs:[{id:1,name:"4 viikon perusohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[{name:"Alavartalo A",ex:[["Kyykky",4,"6–8","","120 s","Pidä keskivartalo tiukkana."],["Hip thrust",4,"8–12","","90 s",""]]}]}]}],library:[]};
let db=JSON.parse(localStorage.built_v12||"null")||seed,page="dash",sel=1,edit=1,modal="";
const save=()=>localStorage.built_v12=JSON.stringify(db),client=()=>db.clients.find(x=>x.id==sel),program=()=>db.programs.find(x=>x.id==edit);
function go(p){page=p;modal="";render()}
function nav(){let a=[["dash","⌂","Dashboard"],["clients","♙","Asiakkaat"],["programs","☷","Ohjelmat"],["library","▦","Pankki"],["msg","○","Viestit"]];nav.innerHTML=a.map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function dashboard(){let x=client();return `<small class=muted>VALMENTAJA</small><h1>${x.name} · Dashboard</h1><p class=muted>Asiakkaan tärkeimmät tulokset yhdellä silmäyksellä.</p><div class=grid><div class=stat>Paino<br><b>${x.weight} kg</b><br><small>↓ ${(x.weights[0]-x.weight).toFixed(1)} kg</small></div><div class=stat>Vyötärö<br><b>${x.waist} cm</b><br><small>↓ ${(x.waists[0]-x.waist).toFixed(1)} cm</small></div><div class=stat>Treeni<br><b>${x.adherence}%</b><br><small>toteutunut</small></div><div class=stat>Tavoite<br><b>${Math.abs(x.weight-x.goal)} kg</b><br><small>matkaa</small></div></div>${card(`<div class=row><h3>Kehitys</h3><select style="width:140px" onchange="draw(this.value)"><option value=weight>Paino</option><option value=waist>Vyötärö</option></select></div><div class=chart><canvas id=c></canvas></div>`)}${card(`<h3>Valmentajan yhteenveto</h3><p class=muted>${x.name} on edennyt ${(x.weights[0]-x.weight).toFixed(1)} kg painossa ja ${(x.waists[0]-x.waist).toFixed(1)} cm vyötärössä. Treenien toteutuminen ${x.adherence}%.</p>`)}<button class="btn p wide" onclick="go('clients')">Avaa asiakkaat</button>`}
function card(s){return `<div class=card>${s}</div>`}
function clients(){return `<small class=muted>VALMENTAJA</small><h1>Asiakkaat</h1>${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><span class=muted>${x.weight} kg</span></div><button class=btn onclick="sel=${x.id};go('client')">Avaa</button></div>`).join("")}`}
function clientPage(){let x=client();return `<small class=muted>ASIAKAS</small><h1>${x.name}</h1>${card(`<div class=grid><div class=stat>Paino<br><b>${x.weight} kg</b></div><div class=stat>Vyötärö<br><b>${x.waist} cm</b></div></div>`)}${card(`<div class=row><div><h3>Harjoitusohjelmat</h3><span class=muted>${x.programs.length} ohjelmaa</span></div><button class="btn p" onclick="newForClient()">+ Uusi</button></div>${x.programs.map(p=>`<div class="item row"><div><b>${p.name}</b><br><small class=muted>${p.weeks.length} viikkoa</small></div><button class=btn onclick="edit=${p.id};modal='editor';render()">Muokkaa</button></div>`).join("")}`)}<button class="btn light wide" onclick="go('programs')">Ohjelmakirjasto</button>`}
function programs(){return `<small class=muted>VALMENTAJA</small><h1>Ohjelmat</h1><button class="btn p wide" onclick="newProgram()">+ Uusi ohjelma</button>${db.programs.map(p=>`<div class=item><div class=row><div><h3>${p.name}</h3><small class=muted>${p.goal} · ${p.weeks.length} viikkoa</small></div><button class=btn onclick="edit=${p.id};modal='editor';render()">Muokkaa</button></div></div>`).join("")}`}
function editor(){let p=program();return `<div class=modal><div class=sheet><h2>Ohjelmaeditori</h2><label>Nimi</label><input id=pn value="${p.name}"><label>Tavoite</label><input id=pg value="${p.goal}">${p.weeks.map((w,wi)=>`<div class=week><div class=row><b>${w.name}</b><button class=btn onclick="removeWeek(${wi})">Poista</button></div>${w.days.map((d,di)=>`<div class=editor><div class=row><input value="${d.name}" onchange="dname(${wi},${di},this.value)"><button class=btn onclick="removeDay(${wi},${di})">Poista</button></div>${d.ex.map((e,ei)=>`<div class=editor><div class=ex><input value="${e[0]}" onchange="ex(${wi},${di},${ei},0,this.value)"><input value="${e[1]}" type=number onchange="ex(${wi},${di},${ei},1,this.value)"><input value="${e[2]}" onchange="ex(${wi},${di},${ei},2,this.value)"><input value="${e[4]}" onchange="ex(${wi},${di},${ei},4,this.value)"><button class=btn onclick="removeEx(${wi},${di},${ei})">×</button></div><input value="${e[5]}" placeholder="Valmentajan ohje" onchange="ex(${wi},${di},${ei},5,this.value)"></div>`).join("")}<button class="btn light" onclick="addEx(${wi},${di})">+ Liike</button></div>`).join("")}<button class="btn light" onclick="addDay(${wi})">+ Treenipäivä</button></div>`).join("")}<button class="btn light wide" onclick="addWeek()">+ Viikko</button><button class="btn p wide" onclick="saveProg()">Tallenna ohjelma</button><button class="btn light wide" onclick="modal='' ;render()">Sulje</button></div></div>`}
function newProgram(){edit=Date.now();db.programs.push({id:edit,name:"Uusi ohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[]} ]});modal="editor";save();render()}
function newForClient(){newProgram();client().programs.push(JSON.parse(JSON.stringify(program())));save()}
function addWeek(){program().weeks.push({name:"Viikko "+(program().weeks.length+1),days:[]});render()}
function removeWeek(i){if(program().weeks.length>1)program().weeks.splice(i,1);render()}
function addDay(w){program().weeks[w].days.push({name:"Uusi treeni",ex:[]});render()}
function removeDay(w,d){program().weeks[w].days.splice(d,1);render()}
function dname(w,d,v){program().weeks[w].days[d].name=v}
function addEx(w,d){program().weeks[w].days[d].ex.push(["Uusi liike",3,"8–12","","90 s",""]);render()}
function removeEx(w,d,e){program().weeks[w].days[d].ex.splice(e,1);render()}
function ex(w,d,e,k,v){program().weeks[w].days[d].ex[e][k]=v}
function saveProg(){program().name=pn.value||"Ohjelma";program().goal=pg.value||"Hypertrofia";save();modal="";render()}
function library(){return `<small class=muted>VALMENTAJA</small><h1>Treenipankki</h1><p class=muted>Valmiit harjoitukset ohjelmien rakentamiseen.</p>${db.library.length?db.library.map(w=>`<div class=item><h3>${w.name}</h3><p class=muted>${w.ex.length} liikettä</p></div>`).join(""):`${card("Treenipankki voidaan täyttää suoraan ohjelmaeditorista.")}`}`}
function messages(){return `<h1>Viestit</h1>${card("Treeniohjelma on päivitetty 💪")}<input placeholder="Kirjoita viesti…"><button class="btn p wide">Lähetä</button>`}
function saveNewClient(){let x={id:Date.now(),name:cn.value||"Uusi asiakas",weight:+cw.value,goal:+cg.value,waist:+cwa.value,goalWaist:+cwa.value-6,weights:[+cw.value],waists:[+cwa.value],adherence:0,programs:[]};db.clients.push(x);save();sel=x.id;modal="";render()}
function modalHtml(){if(!modal)return"";if(modal=="client")return `<div class=modal><div class=sheet><h2>Lisää asiakas</h2><label>Nimi</label><input id=cn><label>Paino</label><input id=cw type=number value=80><label>Tavoitepaino</label><input id=cg type=number value=75><label>Vyötärö</label><input id=cwa type=number value=85><button class="btn p wide" onclick="saveNewClient()">Tallenna</button><button class="btn light wide" onclick="modal='';render()">Peruuta</button></div></div>`;return editor()}
function draw(metric="weight"){let x=client(),v=metric=="waist"?x.waists:x.weights,can=$("c");if(!can)return;let ctx=can.getContext("2d"),w=can.clientWidth,h=can.clientHeight,p=25,d=devicePixelRatio||1;can.width=w*d;can.height=h*d;ctx.scale(d,d);let mn=Math.min(...v)-1,mx=Math.max(...v)+1,px=i=>p+i*(w-2*p)/Math.max(1,v.length-1),py=a=>h-p-(a-mn)/(mx-mn)*(h-2*p);ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(p,h-p);ctx.lineTo(w-p,h-p);ctx.stroke();ctx.strokeStyle="#7440d8";ctx.lineWidth=3;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(px(i),py(a)):ctx.moveTo(px(i),py(a)));ctx.stroke()}
function render(){let m={dash:dashboard,clients,client:clientPage,programs,library,msg:messages};main.innerHTML=(m[page]||dashboard)()+modalHtml();nav();if(page=="dash")draw();}render();
</script></body></html>
