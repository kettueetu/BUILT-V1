<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILT V1.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:820px;margin:auto;padding:18px 18px 100px}.logo{font-size:29px;font-weight:900;margin-bottom:18px}.logo i{font-style:normal;color:#7440d8}
h1{font-size:30px;margin:4px 0 6px}h2,h3{margin:0 0 5px}.muted{color:#777}.small{font-size:13px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.11em;color:#777}
.card,.item,.program,.meal,.week,.day,.exercise{background:#fff;border:1px solid #e4e4df;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fafafa;border-radius:12px;padding:12px}.stat b{font-size:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:11px;background:#111;color:#fff;padding:10px 13px;font-weight:750;cursor:pointer}.btn.p{background:#7440d8}.btn.light{background:#eeeaf8;color:#5d31b4}.btn.danger{background:#f7eaea;color:#9a3333}.btn.small{padding:8px 10px;font-size:12px}.wide{width:100%;margin-top:9px}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd}.navin{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{border:0;background:none;padding:7px 2px;color:#777;font-size:10px}.nav button.on{color:#7440d8;font-weight:850}.nav span{display:block;font-size:19px;margin-bottom:2px}
input,select{width:100%;border:1px solid #d8d8d3;border-radius:10px;padding:10px;background:#fff;font:inherit}label{font-size:12px;color:#777;display:block;margin:9px 0 4px}
.chart{height:230px;background:#fafafa;border:1px solid #ddd;border-radius:14px}.chart canvas{width:100%;height:100%}
.modal{position:fixed;inset:0;background:#0005;z-index:30;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:820px;margin:auto;border-radius:22px 22px 0 0;padding:19px;max-height:94vh;overflow:auto}
.eg{display:grid;grid-template-columns:1.6fr .55fr .7fr .7fr .7fr auto;gap:5px}.eg input{padding:8px;font-size:13px}
</style>
</head>
<body>
<div class="app"><div class="logo">BUILT<i>.</i></div><main id="main"></main></div>
<nav class="nav"><div class="navin" id="nav"></div></nav>
<script>
const seed={
clients:[{id:1,name:"Emma",weight:82.4,goalWeight:78,weights:[84.2,83.7,83.1,82.8,82.4,81.9,81.6],adherence:92,programs:[101],diet:201}],
programs:[{id:101,name:"4 viikon perusohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[{name:"Alavartalo A",ex:[["Kyykky",4,"6–8","","120 s","Pidä keskivartalo tiukkana."],["Romanialainen maastaveto",3,"8–10","","120 s",""],["Hip thrust",4,"8–12","","90 s",""]]}]},{name:"Viikko 2",days:[]},{name:"Viikko 3",days:[]},{name:"Viikko 4",days:[]}]}],
library:[{id:301,name:"Alavartalo A",ex:[["Kyykky",4,"6–8","","120 s",""],["Romanialainen maastaveto",3,"8–10","","120 s",""]]}],
diets:[{id:201,name:"2300 kcal · Painonpudotus",kcal:2300,p:170,c:230,f:75,meals:[{name:"Aamiainen",foods:[["Kaurapuuro",60,"g"],["Banaani",1,"kpl"],["Rahka",200,"g"]]},{name:"Lounas",foods:[["Kana",150,"g"],["Riisi",100,"g"],["Kasvikset",200,"g"]]},{name:"Välipala",foods:[["Ruisleipä",2,"kpl"],["Kananmuna",2,"kpl"]]}]}]
};
let db=JSON.parse(localStorage.getItem("built_v13")||"null")||seed;
let role="coach",page="dashboard",selected=1,editProgram=null,editDiet=null,modal="";
const $=id=>document.getElementById(id),save=()=>localStorage.setItem("built_v13",JSON.stringify(db));
const client=()=>db.clients.find(x=>x.id===selected),prog=()=>db.programs.find(x=>x.id===editProgram),diet=()=>db.diets.find(x=>x.id===editDiet);
function go(p){page=p;modal="";render()}
function toggleRole(){role=role==="coach"?"client":"coach";page=role==="coach"?"dashboard":"home";render()}
function nav(){let a=role==="coach"?[["dashboard","⌂","Dashboard"],["clients","♙","Asiakkaat"],["workouts","🏋","Harjoitukset"],["nutrition","🍎","Ravinto"],["library","▦","Treenipankki"],["messages","○","Viestit"]]:[["home","⌂","Koti"],["clientWorkout","🏋","Treeni"],["clientFood","🍎","Ravinto"],["progress","↗","Paino"],["messages","○","Viestit"]];nav.innerHTML=a.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function card(x){return `<div class=card>${x}</div>`}
function dashboard(){let x=client(),change=x.weights[0]-x.weight;return `<div class=eyebrow>VALMENTAJA</div><h1>Dashboard</h1><p class=muted>Oleelliset asiat yhdellä silmäyksellä.</p>${card(`<div class=grid><div class=stat>Nykyinen paino<br><b>${x.weight} kg</b><br><small>Muutos ↓ ${change.toFixed(1)} kg</small></div><div class=stat>Tavoitepaino<br><b>${x.goalWeight} kg</b><br><small>${Math.abs(x.weight-x.goalWeight).toFixed(1)} kg jäljellä</small></div><div class=stat>Treeni<br><b>${x.adherence}%</b><br><small>toteutunut</small></div><div class=stat>Asiakas<br><b>${x.name}</b></div></div>`)}${card(`<h3>Painon kehitys</h3><div class=chart><canvas id=chart></canvas></div>`)}${card(`<h3>Harjoitusohjelma</h3><p class=muted>${db.programs.find(p=>x.programs.includes(p.id))?.name||"Ei ohjelmaa"}</p><button class="btn p" onclick="go('workouts')">Muokkaa harjoituksia</button>`)}${card(`<h3>Ravinto</h3><p class=muted>${db.diets.find(d=>d.id===x.diet)?.name||"Ei ruokavaliota"}</p><button class="btn p" onclick="go('nutrition')">Muokkaa ravintoa</button>`)}`}
function clients(){return `<div class=eyebrow>VALMENTAJA</div><h1>Asiakkaat</h1><button class="btn p wide" onclick="modal='newClient';render()">+ Lisää asiakas</button>${db.clients.map(x=>`<div class=item><div class=row><div><h3>${x.name}</h3><div class=muted>${x.weight} kg · tavoite ${x.goalWeight} kg</div></div><button class=btn onclick="selected=${x.id};go('client')">Avaa</button></div></div>`).join("")}`}
function clientPage(){let x=client(),p=db.programs.find(p=>x.programs.includes(p.id)),d=db.diets.find(d=>d.id===x.diet);return `<div class=eyebrow>ASIAKAS</div><h1>${x.name}</h1>${card(`<div class=grid><div class=stat>Nykyinen<br><b>${x.weight} kg</b></div><div class=stat>Tavoite<br><b>${x.goalWeight} kg</b></div></div><button class="btn light wide" onclick="go('dashboard')">Dashboard</button>`)}${card(`<div class=row><div><h3>Harjoitusohjelma</h3><div class=muted>${p?.name||"Ei ohjelmaa"}</div></div><button class="btn p" onclick="newClientProgram()">+ Ohjelma</button></div>${p?`<button class="btn light wide" onclick="editProgram=${p.id};modal='programEditor';render()">Muokkaa ohjelmaa</button>`:""}`)}${card(`<div class=row><div><h3>Ravinto</h3><div class=muted>${d?.name||"Ei ruokavaliota"}</div></div><button class="btn p" onclick="newClientDiet()">+ Ruokavalio</button></div>${d?`<button class="btn light wide" onclick="editDiet=${d.id};modal='dietEditor';render()">Muokkaa ruokavaliota</button>`:""}`)}<button class="btn light wide" onclick="go('clients')">← Asiakkaat</button>`}
function workouts(){return `<div class=eyebrow>VALMENTAJA</div><h1>Harjoitukset</h1><p class=muted>Ohjelmien luonti ja muokkaus.</p><button class="btn p wide" onclick="newProgram()">+ Uusi ohjelma</button>${db.programs.map(p=>`<div class=program><div class=row><div><h3>${p.name}</h3><div class=muted>${p.goal} · ${p.weeks.length} viikkoa</div></div><button class=btn onclick="editProgram=${p.id};modal='programEditor';render()">Muokkaa</button></div><button class="btn light wide" onclick="saveToLibrary(${p.id})">Tallenna Treenipankkiin</button></div>`).join("")}`}
function programEditor(){let p=prog();return `<div class=modal><div class=sheet><div class=row><h2>Muokkaa ohjelmaa</h2><button class="btn danger small" onclick="deleteProgram()">Poista</button></div><label>Ohjelman nimi</label><input id=pname value="${p.name}"><label>Tavoite</label><select id=pgoal><option>Hypertrofia</option><option>Voima</option><option>Olympianostot</option><option>Yleiskunto</option></select>${p.weeks.map((w,wi)=>`<div class=week><div class=row><b>${w.name}</b><button class="btn danger small" onclick="removeWeek(${wi})">Poista</button></div>${w.days.map((d,di)=>`<div class=day><div class=row><input value="${d.name}" onchange="dayName(${wi},${di},this.value)"><button class="btn danger small" onclick="removeDay(${wi},${di})">Poista</button></div>${d.ex.map((e,ei)=>`<div class=exercise><div class=eg><input value="${e[0]}" onchange="setEx(${wi},${di},${ei},0,this.value)"><input type=number value="${e[1]}" onchange="setEx(${wi},${di},${ei},1,this.value)"><input value="${e[2]}" onchange="setEx(${wi},${di},${ei},2,this.value)"><input value="${e[3]}" placeholder="kg" onchange="setEx(${wi},${di},${ei},3,this.value)"><input value="${e[4]}" placeholder="lepo" onchange="setEx(${wi},${di},${ei},4,this.value)"><button class="btn danger small" onclick="removeEx(${wi},${di},${ei})">×</button></div><input value="${e[5]}" placeholder="Valmentajan ohje" onchange="setEx(${wi},${di},${ei},5,this.value)"></div>`).join("")}<button class="btn light small" onclick="addEx(${wi},${di})">+ Liike</button></div>`).join("")}<button class="btn light small" onclick="addDay(${wi})">+ Treenipäivä</button></div>`).join("")}<button class="btn light wide" onclick="addWeek()">+ Viikko</button><button class="btn p wide" onclick="saveProgram()">Tallenna muutokset</button><button class="btn light wide" onclick="modal='';render()">Sulje</button></div></div>`}
function nutrition(){return `<div class=eyebrow>VALMENTAJA</div><h1>Ravinto</h1><p class=muted>Ruokavalioiden ja aterioiden muokkaus.</p><button class="btn p wide" onclick="newDiet()">+ Uusi ruokavalio</button>${db.diets.map(d=>`<div class=program><div class=row><div><h3>${d.name}</h3><div class=muted>${d.kcal} kcal · P ${d.p} · H ${d.c} · R ${d.f}</div></div><button class=btn onclick="editDiet=${d.id};modal='dietEditor';render()">Muokkaa</button></div><div class=small>${d.meals.length} ateriaa</div></div>`).join("")}`}
function dietEditor(){let d=diet();return `<div class=modal><div class=sheet><div class=row><h2>Muokkaa ruokavaliota</h2><button class="btn danger small" onclick="deleteDiet()">Poista</button></div><label>Nimi</label><input id=dname value="${d.name}"><div class=grid><div><label>Kalorit</label><input id=dk type=number value="${d.kcal}"></div><div><label>Proteiini</label><input id=dp type=number value="${d.p}"></div><div><label>Hiilihydraatit</label><input id=dc type=number value="${d.c}"></div><div><label>Rasva</label><input id=df type=number value="${d.f}"></div></div>${d.meals.map((m,mi)=>`<div class=meal><div class=row><input value="${m.name}" onchange="mealName(${mi},this.value)"><button class="btn danger small" onclick="removeMeal(${mi})">Poista</button></div>${m.foods.map((f,fi)=>`<div class=item><div class=row><input value="${f[0]}" onchange="foodEdit(${mi},${fi},0,this.value)"><input style="max-width:75px" type=number value="${f[1]}" onchange="foodEdit(${mi},${fi},1,this.value)"><span class=small>${f[2]}</span><button class="btn danger small" onclick="removeFood(${mi},${fi})">×</button></div></div>`).join("")}<button class="btn light small" onclick="addFood(${mi})">+ Ruoka</button></div>`).join("")}<button class="btn light wide" onclick="addMeal()">+ Ateria</button><button class="btn p wide" onclick="saveDiet()">Tallenna muutokset</button><button class="btn light wide" onclick="modal='';render()">Sulje</button></div></div>`}
function library(){return `<div class=eyebrow>VALMENTAJA</div><h1>Treenipankki</h1><p class=muted>Valmiiksi tallennetut harjoitukset.</p>${db.library.map(w=>`<div class=item><div class=row><div><h3>${w.name}</h3><div class=muted>${w.ex.length} liikettä</div></div><button class="btn danger small" onclick="db.library=db.library.filter(x=>x.id!==${w.id});save();render()">Poista</button></div></div>`).join("")||card("Treenipankki on tyhjä.")}`}
function messages(){return `<div class=eyebrow>KOMMUNIKAATIO</div><h1>Viestit</h1>${card("Treeniohjelma on päivitetty 💪")}<input placeholder="Kirjoita viesti…"><button class="btn p wide">Lähetä</button>`}
function home(){let x=client();return `<div class=eyebrow>ASIAKAS</div><h1>Hei ${x.name} 👋</h1>${card(`<h3>Tämän päivän treeni</h3><p class=muted>${db.programs.find(p=>x.programs.includes(p.id))?.name||"Ei treeniä"}</p><button class="btn p wide" onclick="go('clientWorkout')">Aloita treeni</button>`)}${card(`<h3>Paino</h3><h2>${x.weight} kg</h2><button class="btn light wide" onclick="go('progress')">Seuraa kehitystä</button>`)}`}
function clientWorkout(){let x=client(),p=db.programs.find(p=>x.programs.includes(p.id)),d=p?.weeks[0]?.days[0];return `<div class=eyebrow>TREENI</div><h1>${d?.name||"Treeni"}</h1>${(d?.ex||[]).map((e,i)=>`<div class=item row><div><b>${i+1}. ${e[0]}</b><div class=muted>${e[1]} × ${e[2]} · lepo ${e[4]}</div></div><button class=btn onclick="this.textContent='✓'">Tehty</button></div>`).join("")}`}
function clientFood(){let d=db.diets.find(d=>d.id===client().diet);return `<div class=eyebrow>RAVINTO</div><h1>${d?.name||"Ravinto"}</h1>${d?d.meals.map(m=>card(`<h3>${m.name}</h3>${m.foods.map(f=>`<div class=row><span>${f[0]}</span><span class=muted>${f[1]} ${f[2]}</span></div>`).join("")}`)).join(""):card("Ruokavaliota ei ole määritetty.")}`}
function progress(){let x=client();return `<div class=eyebrow>PAINO</div><h1>Painon kehitys</h1>${card(`<h2>${x.weight} kg</h2><div class=muted>Tavoite ${x.goalWeight} kg</div><div class=chart><canvas id=clientChart></canvas></div>`)} `}
function newProgram(){editProgram=Date.now();db.programs.push({id:editProgram,name:"Uusi ohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[]}]});save();modal="programEditor";render()}
function newClientProgram(){newProgram();client().programs.push(editProgram);save()}
function addWeek(){prog().weeks.push({name:"Viikko "+(prog().weeks.length+1),days:[]});render()}
function removeWeek(i){if(prog().weeks.length>1)prog().weeks.splice(i,1);render()}
function addDay(w){prog().weeks[w].days.push({name:"Uusi treeni",ex:[]});render()}
function removeDay(w,d){prog().weeks[w].days.splice(d,1);render()}
function dayName(w,d,v){prog().weeks[w].days[d].name=v}
function addEx(w,d){prog().weeks[w].days[d].ex.push(["Uusi liike",3,"8–12","","90 s",""]);render()}
function removeEx(w,d,e){prog().weeks[w].days[d].ex.splice(e,1);render()}
function setEx(w,d,e,k,v){prog().weeks[w].days[d].ex[e][k]=v}
function saveProgram(){prog().name=$("pname").value||"Ohjelma";prog().goal=$("pgoal").value;save();modal="";render()}
function deleteProgram(){db.programs=db.programs.filter(p=>p.id!==editProgram);db.clients.forEach(c=>c.programs=c.programs.filter(id=>id!==editProgram));save();modal="";render()}
function saveToLibrary(id){let p=db.programs.find(x=>x.id===id),d=p.weeks[0]?.days[0];if(!d)return alert("Lisää ensin treenipäivä.");db.library.push({id:Date.now(),name:d.name,ex:JSON.parse(JSON.stringify(d.ex))});save();alert("Tallennettu Treenipankkiin.")}
function newDiet(){editDiet=Date.now();db.diets.push({id:editDiet,name:"Uusi ruokavalio",kcal:2300,p:170,c:230,f:75,meals:[{name:"Aamiainen",foods:[]}]});save();modal="dietEditor";render()}
function newClientDiet(){newDiet();client().diet=editDiet;save()}
function mealName(i,v){diet().meals[i].name=v}
function addMeal(){diet().meals.push({name:"Uusi ateria",foods:[]});render()}
function removeMeal(i){diet().meals.splice(i,1);render()}
function addFood(i){diet().meals[i].foods.push(["Uusi ruoka",1,"kpl"]);render()}
function removeFood(i,j){diet().meals[i].foods.splice(j,1);render()}
function foodEdit(i,j,k,v){diet().meals[i].foods[j][k]=v}
function saveDiet(){let d=diet();d.name=$("dname").value||"Ruokavalio";d.kcal=+$("dk").value;d.p=+$("dp").value;d.c=+$("dc").value;d.f=+$("df").value;save();modal="";render()}
function deleteDiet(){db.diets=db.diets.filter(d=>d.id!==editDiet);db.clients.forEach(c=>{if(c.diet===editDiet)c.diet=null});save();modal="";render()}
function saveClient(){let w=+$("cw").value,g=+$("cg").value;db.clients.push({id:Date.now(),name:$("cn").value||"Uusi asiakas",weight:w,goalWeight:g,weights:[w],adherence:0,programs:[],diet:null});save();modal="";render()}
function modalHtml(){if(modal==="programEditor")return programEditor();if(modal==="dietEditor")return dietEditor();if(modal==="newClient")return `<div class=modal><div class=sheet><h2>Lisää asiakas</h2><label>Nimi</label><input id=cn><label>Paino kg</label><input id=cw type=number value=80><label>Tavoitepaino kg</label><input id=cg type=number value=75><button class="btn p wide" onclick="saveClient()">Tallenna asiakas</button><button class="btn light wide" onclick="modal='';render()">Peruuta</button></div></div>`;return""}
function draw(id){let x=client(),v=x.weights,c=$(id);if(!c)return;let ctx=c.getContext("2d"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,p=28,mn=Math.min(...v,x.goalWeight)-1,mx=Math.max(...v,x.goalWeight)+1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let px=i=>p+i*(w-2*p)/Math.max(1,v.length-1),py=a=>h-p-(a-mn)/(mx-mn)*(h-2*p);ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(p,h-p);ctx.lineTo(w-p,h-p);ctx.stroke();ctx.strokeStyle="#268a52";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(p,py(x.goalWeight));ctx.lineTo(w-p,py(x.goalWeight));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle="#7440d8";ctx.lineWidth=3;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(px(i),py(a)):ctx.moveTo(px(i),py(a)));ctx.stroke()}
function render(){let m=role==="coach"?{dashboard,clients,client:clientPage,workouts,nutrition,library,messages}:{home,clientWorkout,clientFood,progress,messages};main.innerHTML=(m[page]||dashboard)()+modalHtml();nav();if(page==="dashboard")draw("chart");if(page==="progress")draw("clientChart")}
render();
</script>
</body></html>
