<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILT V1</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#777;--line:#e6e6e3;--p:#7440d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900}.logo i{color:var(--p);font-style:normal}
main{padding:8px 18px 24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}h1{font-size:30px;letter-spacing:-.7px;margin:4px 0 6px}h2{margin:0 0 5px}h3{margin:0 0 4px;font-size:16px}.sub,.muted{color:var(--muted)}.small{font-size:13px}
.card,.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fafafa;border-radius:13px;padding:13px}.stat b{font-size:23px}
.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 15px;font-weight:750;width:100%;margin-top:10px}.btn.p{background:var(--p)}.btn.light{background:#eeeaf8;color:#5d31b4}.btn.small{width:auto;margin:0;padding:8px 10px}.pill{border:0;border-radius:99px;padding:8px 11px;background:#eee;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:4}.navin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px 8px}.nav button{border:0;background:none;color:#888;font-size:11px;padding:5px}.nav button.on{color:var(--p);font-weight:800}.nav span{display:block;font-size:19px}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;font:inherit}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.list{display:grid;gap:8px}.check{width:23px;height:23px;border:2px solid #bbb;border-radius:50%;background:#fff;color:#fff}.check.done{background:var(--p);border-color:var(--p)}
.tabs{display:flex;gap:5px;background:#e9e9e7;padding:4px;border-radius:11px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700}.tabs .on{background:#fff}
.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:10}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:560px;margin:auto;padding:20px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">BUILT<i>.</i></div><button class="pill" id="role" onclick="toggleRole()">Valmentaja</button></div>
<main id="main"></main>
<div class="nav"><div class="navin" id="nav"></div></div>
</div>
<script>
const db={clients:[
{id:1,name:"Emma",age:30,sex:"Nainen",height:170,weight:82.4,goalWeight:78,activity:"Kohtalainen",goal:"Painonpudotus",notes:"Pidetään treenit 4x/vko.",workouts:[],diet:null},
{id:2,name:"Mikko",age:36,sex:"Mies",height:181,weight:91.2,goalWeight:85,activity:"Korkea",goal:"Painonpudotus",notes:"",workouts:[],diet:null}
],library:[
{name:"Alavartalo A",tags:"Alavartalo · Hypertrofia",ex:[["Kyykky",4,"6–8","120 s"],["Romanialainen maastaveto",3,"8–10","120 s"],["Hip thrust",4,"8–12","90 s"],["Reiden koukistus",3,"10–15","60 s"]]},
{name:"Ylävartalo A",tags:"Ylävartalo · Hypertrofia",ex:[["Penkkipunnerrus",4,"6–8","120 s"],["Ylätalja",4,"8–12","90 s"],["Vinopenkki käsipainoilla",3,"8–12","90 s"],["Soutu",3,"10–12","90 s"]]}
],dietLibrary:[
{name:"2300 kcal · Painonpudotus",kcal:2300,p:170,c:230,f:75},
{name:"2500 kcal · Ylläpito",kcal:2500,p:170,c:280,f:78}
]};
let role="coach",page="home",selected=1,modal="",applyIndex=0;

function bmr(x){let v=10*x.weight+6.25*x.height-5*x.age;return Math.round(x.sex==="Mies"?v+5:v-161)}
function tdee(x){let m={Kevyt:1.375,Kohtalainen:1.55,Korkea:1.725}[x.activity];return Math.round(bmr(x)*m)}
function c(x){return `<div class="card">${x}</div>`}
function go(p){page=p;render()}
function toggleRole(){role=role==="coach"?"client":"coach";page="home";document.getElementById("role").textContent=role==="coach"?"Valmentaja":"Asiakas";render()}
function nav(){let a=role==="coach"?[["home","⌂","Koti"],["clients","♙","Asiakkaat"],["programs","☷","Ohjelmat"],["library","▦","Pankit"],["messages","○","Viestit"]]:[["home","⌂","Koti"],["workout","◈","Treeni"],["food","◉","Ravinto"],["progress","⌁","Seuranta"],["messages","○","Viestit"]];document.getElementById("nav").innerHTML=a.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function goClient(id){selected=id;page="client";render()}

function home(){
if(role==="client")return `<div class="eyebrow">ASIAKAS</div><h1>Hei, Emma! 👋</h1><p class="sub">Tässä tämän päivän tärkeimmät asiat.</p>
${c(`<h3>Tämän päivän treeni</h3><h2>Alavartalo A</h2><p class="muted">4 liikettä · noin 55 min</p><button class="btn" onclick="go('workout')">Aloita treeni</button>`)}
${c(`<h3>Ravinto</h3><div style="font-size:28px;font-weight:800">1 850 / 2 300 kcal</div><p class="muted">P 122 / 170 · H 132 / 230 · R 38 / 75</p><button class="btn light" onclick="go('food')">Avaa ravinto</button>`)}
`;
return `<div class="eyebrow">VALMENTAJA</div><h1>Hyvää päivää!</h1><p class="sub">BUILT V1 · valmennuksen työtila</p>
${c(`<div class="grid"><div class="stat"><div class="small muted">Asiakkaita</div><b>${db.clients.length}</b></div><div class="stat"><div class="small muted">Treenipankki</div><b>${db.library.length}</b></div></div>`)}
${c(`<h3>Viimeisimmät</h3><div class="item">Emma · ohjelma valmis</div><div class="item">Mikko · paino päivitetty</div>`)}
<button class="btn p" onclick="go('clients')">Avaa asiakkaat</button>`;
}

function clients(){return `<div class="eyebrow">VALMENTAJA</div><h1>Asiakkaat</h1><p class="sub">${db.clients.length} aktiivista asiakasta</p>
<div class="list">${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.weight} kg · ${x.goal}</div></div><button class="btn small" onclick="goClient(${x.id})">Avaa</button></div>`).join("")}</div>
<button class="btn p" onclick="modal='client';render()">+ Lisää asiakas</button>`}

function client(){
let x=db.clients.find(a=>a.id===selected);
return `<div class="eyebrow">ASIAKAS</div><h1>${x.name}</h1><p class="sub">${x.goal} · ${x.weight} kg → ${x.goalWeight} kg</p>
${c(`<div class="grid"><div class="stat"><div class="small muted">Ikä</div><b>${x.age}</b></div><div class="stat"><div class="small muted">Pituus</div><b>${x.height} cm</b></div><div class="stat"><div class="small muted">BMR</div><b>${bmr(x)} kcal</b></div><div class="stat"><div class="small muted">TDEE</div><b>${tdee(x)} kcal</b></div></div>`)}
${c(`<div class="row"><div><h3>Harjoitusohjelma</h3><div class="muted small">${x.workouts.length} harjoitusta</div></div><button class="btn small p" onclick="modal='workout';render()">+ Lisää</button></div>`)}
${x.workouts.map(w=>c(`<h3>${w.name}</h3><div class="muted small">${w.tags}</div>`)).join("")}
${c(`<div class="row"><div><h3>Ravinto-ohjelma</h3><div class="muted small">${x.diet?x.diet.kcal+" kcal · P "+x.diet.p+" g · H "+x.diet.c+" g · R "+x.diet.f+" g":"Ei määritetty"}</div></div><button class="btn small p" onclick="modal='diet';render()">Muokkaa</button></div>`)}
${c(`<h3>Muistiinpanot</h3><p class="muted">${x.notes||"Ei muistiinpanoja."}</p>`)}
<button class="btn light" onclick="go('clients')">← Asiakkaat</button>`;
}

function programs(){return `<div class="eyebrow">VALMENTAJA</div><h1>Ohjelmat</h1><p class="sub">Valitse asiakas ja rakenna viikko.</p>
${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.workouts.length} harjoitusta</div></div><button class="btn small p" onclick="selected=${x.id};modal='workout';render()">+ Treeni</button></div>`).join("")}
${c(`<h3>Treenipankki säästää aikaa</h3><p class="muted small">Luo harjoitus kerran, tallenna se pankkiin ja käytä sitä uudelleen eri asiakkaille.</p>`)}`;
}

function library(){return `<div class="eyebrow">VALMENTAJA</div><h1>Pankit</h1><div class="tabs"><button class="on">Treenipankki</button><button onclick="alert('Ruokavaliopankki: pohjat ovat jo tietomallissa ja käyttöliittymä laajennetaan seuraavassa vaiheessa.')">Ruokavaliot</button></div>
<button class="btn p" onclick="modal='newlib';render()">+ Luo harjoitus</button>
<div class="list">${db.library.map((w,i)=>`<div class="item"><h3>${w.name}</h3><div class="muted small">${w.tags}</div><p class="small">${w.ex.map(e=>e[0]+" · "+e[1]+"×"+e[2]).join(" · ")}</p><button class="btn light" onclick="applyIndex=${i};modal='apply';render()">Käytä asiakkaalle</button></div>`).join("")}</div>`}

function workout(){let w=db.library[0];return `<div class="eyebrow">TREENI</div><h1>${w.name}</h1><p class="sub">Tämän päivän harjoitus</p>
<div class="list">${w.ex.map((e,i)=>`<div class="item row"><div><h3>${i+1}. ${e[0]}</h3><div class="muted small">${e[1]} × ${e[2]} · lepo ${e[3]}</div></div><button class="check" onclick="this.classList.toggle('done');this.textContent=this.textContent?'':'✓'"></button></div>`).join("")}</div>
<button class="btn p" onclick="alert('Treeni merkitty tehdyksi!')">Lopeta treeni</button>`}

function food(){return `<div class="eyebrow">RAVINTO</div><h1>Ravinto</h1><p class="sub">Tämän päivän tavoitteet</p>
${c(`<div class="grid"><div class="stat"><div class="small muted">Kalorit</div><b>2300</b></div><div class="stat"><div class="small muted">Proteiini</div><b>170 g</b></div><div class="stat"><div class="small muted">Hiilihydraatit</div><b>230 g</b></div><div class="stat"><div class="small muted">Rasva</div><b>75 g</b></div></div>`)}
${["Aamiainen","Lounas","Välipala","Päivällinen"].map(x=>`<div class="item row"><div><h3>${x}</h3><div class="muted small">Ei ateriaa lisätty</div></div><button class="btn small p" onclick="alert('Ruoka lisätään tähän')">+</button></div>`).join("")}`}

function progress(){return `<div class="eyebrow">SEURANTA</div><h1>Kehitys</h1><p class="sub">Paino ja tavoitteet</p>${c(`<div class="row"><div><div class="small muted">Nykyinen paino</div><div style="font-size:32px;font-weight:800">82,4 kg</div></div><div style="text-align:right"><div class="small muted">Tavoite</div><b>78 kg</b></div></div><div style="height:120px;border-bottom:1px solid #ddd;margin-top:15px;background:linear-gradient(165deg,transparent 45%,#7440d8 46%,#7440d8 48%,transparent 49%)"></div>`)}</div>`}

function messages(){return `<div class="eyebrow">KOMMUNIKAATIO</div><h1>Viestit</h1><p class="sub">Valmentaja ↔ asiakas</p>${c(`<div style="background:#eee;padding:11px;border-radius:15px;width:max-content">Treeniohjelma on päivitetty 💪</div><div style="background:#7440d8;color:#fff;padding:11px;border-radius:15px;width:max-content;margin:8px 0 8px auto">Kiitos! Katson sen tänään.</div>`)}<input placeholder="Kirjoita viesti…"><button class="btn" onclick="alert('Demo: viesti lähetetty')">Lähetä</button>`}

function modalHtml(){
if(!modal)return "";
if(modal==="client")return `<div class="modal"><div class="sheet"><h2>Lisää asiakas</h2>
<label>Nimi</label><input id="n" placeholder="Esim. Anna"><label>Ikä</label><input id="age" type="number" value="30">
<label>Sukupuoli</label><select id="sex"><option>Nainen</option><option>Mies</option></select>
<label>Pituus cm</label><input id="h" type="number" value="170"><label>Paino kg</label><input id="w" type="number" value="80"><label>Tavoitepaino kg</label><input id="gw" type="number" value="75">
<label>Aktiivisuus</label><select id="act"><option>Kevyt</option><option selected>Kohtalainen</option><option>Korkea</option></select>
<label>Tavoite</label><select id="goal"><option>Painonpudotus</option><option>Painonhallinta</option><option>Lihasmassan kasvatus</option></select>
<button class="btn p" onclick="saveClient()">Tallenna asiakas</button><button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="workout")return `<div class="modal"><div class="sheet"><h2>Lisää harjoitus asiakkaalle</h2><p class="muted">Valitse valmis harjoitus Treenipankista.</p>${db.library.map((w,i)=>`<div class="item row"><div><h3>${w.name}</h3><div class="muted small">${w.tags}</div></div><button class="btn small p" onclick="applyWorkout(${i})">Käytä</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="diet")return `<div class="modal"><div class="sheet"><h2>Ravinto-ohjelma</h2><p class="muted">Valitse valmis tavoitepohja.</p>${db.dietLibrary.map((d,i)=>`<div class="item row"><div><h3>${d.name}</h3><div class="muted small">P ${d.p} · H ${d.c} · R ${d.f}</div></div><button class="btn small p" onclick="applyDiet(${i})">Käytä</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="newlib")return `<div class="modal"><div class="sheet"><h2>Uusi treeni</h2><label>Nimi</label><input id="ln" placeholder="Esim. Koko keho A"><label>Tunnisteet</label><input id="lt" placeholder="Koko keho · Hypertrofia"><label>Ensimmäinen liike</label><input id="le" placeholder="Esim. Goblet-kyykky"><button class="btn p" onclick="saveLib()">Tallenna pankkiin</button><button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="apply")return `<div class="modal"><div class="sheet"><h2>Käytä treeniä asiakkaalle</h2>${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.workouts.length} harjoitusta</div></div><button class="btn small p" onclick="selected=${x.id};applyWorkout(${applyIndex})">Lisää</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
}
function saveClient(){let x={id:Date.now(),name:document.getElementById("n").value||"Uusi asiakas",age:+document.getElementById("age").value,sex:document.getElementById("sex").value,height:+document.getElementById("h").value,weight:+document.getElementById("w").value,goalWeight:+document.getElementById("gw").value,activity:document.getElementById("act").value,goal:document.getElementById("goal").value,notes:"",workouts:[],diet:null};db.clients.push(x);selected=x.id;modal="";page="clients";render()}
function applyWorkout(i){let x=db.clients.find(a=>a.id===selected),w=db.library[i];x.workouts.push(JSON.parse(JSON.stringify(w)));modal="";page="client";render()}
function applyDiet(i){let x=db.clients.find(a=>a.id===selected);x.diet={...db.dietLibrary[i]};modal="";page="client";render()}
function saveLib(){let n=document.getElementById("ln").value||"Uusi harjoitus",t=document.getElementById("lt").value||"Oma",e=document.getElementById("le").value||"Uusi liike";db.library.push({name:n,tags:t,ex:[[e,3,"8–12","90 s"]]});modal="";page="library";render()}
function render(){let map=role==="coach"?{home,clients,client,programs,library,messages}:{home,workout,food,progress,messages};document.getElementById("main").innerHTML=(map[page]||home)()+modalHtml();nav()}
render();
</script>
</body></html>
