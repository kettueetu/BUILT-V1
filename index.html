<!doctype html><html lang="fi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILT V1.1</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#777;--line:#e6e6e3;--p:#7440d8;--g:#268a52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:700px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:20px 18px 10px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900}.logo i{color:var(--p);font-style:normal}
main{padding:8px 18px 24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}h1{font-size:30px;margin:4px 0 6px}h2{margin:0 0 5px}h3{margin:0 0 4px;font-size:16px}.sub,.muted{color:var(--muted)}.small{font-size:13px}
.card,.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fafafa;border-radius:13px;padding:13px}.stat b{font-size:22px}
.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 15px;font-weight:750;width:100%;margin-top:10px}.btn.p{background:var(--p)}.btn.light{background:#eeeaf8;color:#5d31b4}.btn.small{width:auto;margin:0;padding:8px 10px}.pill{border:0;border-radius:99px;padding:8px 11px;background:#eee;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:4}.navin{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px 8px}.nav button{border:0;background:none;color:#888;font-size:11px;padding:5px}.nav button.on{color:var(--p);font-weight:800}.nav span{display:block;font-size:19px}
input,select{width:100%;border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;font:inherit}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:flex-end;z-index:10}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:700px;margin:auto;padding:20px;max-height:92vh;overflow:auto}
.chart{width:100%;height:230px;background:#fafafa;border-radius:14px;border:1px solid var(--line)}canvas{width:100%;height:100%}.badge{display:inline-block;background:#eeeaf8;color:#5d31b4;padding:5px 8px;border-radius:99px;font-size:12px;font-weight:700}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.eg{display:grid;grid-template-columns:1.5fr .5fr .7fr .7fr auto;gap:7px}.eg input{padding:8px}
</style></head><body><div class="app">
<div class="top"><div class="logo">BUILT<i>.</i></div><button class="pill" id="role" onclick="toggleRole()">Valmentaja</button></div>
<main id="main"></main><div class="nav"><div class="navin" id="nav"></div></div></div>
<script>
const seed={clients:[
{id:1,name:"Emma",age:30,sex:"Nainen",height:170,weight:82.4,goalWeight:78,activity:"Kohtalainen",goal:"Painonpudotus",notes:"Pidetään treenit 4x/vko.",weights:[84.2,83.7,83.1,82.8,82.4,81.9,81.6],workouts:[],diet:null},
{id:2,name:"Mikko",age:36,sex:"Mies",height:181,weight:91.2,goalWeight:85,activity:"Korkea",goal:"Painonpudotus",notes:"",weights:[94,93.4,92.7,92.1,91.8,91.5,91.2],workouts:[],diet:null}],
library:[
{name:"Alavartalo A",tags:"Alavartalo · Hypertrofia",ex:[["Kyykky",4,"6–8","120 s",""],["Romanialainen maastaveto",3,"8–10","120 s",""],["Hip thrust",4,"8–12","90 s",""],["Reiden koukistus",3,"10–15","60 s",""]]},
{name:"Ylävartalo A",tags:"Ylävartalo · Hypertrofia",ex:[["Penkkipunnerrus",4,"6–8","120 s",""],["Ylätalja",4,"8–12","90 s",""],["Vinopenkki käsipainoilla",3,"8–12","90 s",""],["Soutu",3,"10–12","90 s",""]]}],
dietLibrary:[{name:"2300 kcal · Painonpudotus",kcal:2300,p:170,c:230,f:75},{name:"2500 kcal · Ylläpito",kcal:2500,p:170,c:280,f:78}]};
let db=JSON.parse(localStorage.getItem("built_v11")||"null")||seed,role="coach",page="home",selected=1,modal="",applyIndex=0,builder=[];
const save=()=>localStorage.setItem("built_v11",JSON.stringify(db));
const bmr=x=>Math.round((10*x.weight+6.25*x.height-5*x.age)+(x.sex==="Mies"?5:-161));
const tdee=x=>Math.round(bmr(x)*({Kevyt:1.375,Kohtalainen:1.55,Korkea:1.725}[x.activity]||1.55));
const C=x=>`<div class="card">${x}</div>`;
function nav(){let a=role==="coach"?[["home","⌂","Koti"],["clients","♙","Asiakkaat"],["programs","☷","Ohjelmat"],["library","▦","Pankit"],["messages","○","Viestit"]]:[["home","⌂","Koti"],["workout","◈","Treeni"],["food","◉","Ravinto"],["progress","⌁","Seuranta"],["messages","○","Viestit"]];nav.innerHTML=a.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}
function go(p){page=p;render()} function toggleRole(){role=role==="coach"?"client":"coach";page="home";roleBtn.textContent=role==="coach"?"Valmentaja":"Asiakas";render()}
function home(){if(role==="client")return `<div class="eyebrow">ASIAKAS</div><h1>Hei, Emma! 👋</h1><p class="sub">Tämän päivän tärkeimmät asiat.</p>${C(`<h3>Tämän päivän treeni</h3><h2>Alavartalo A</h2><p class="muted">4 liikettä · noin 55 min</p><button class="btn" onclick="go('workout')">Aloita treeni</button>`)}${C(`<h3>Ravinto</h3><div style="font-size:28px;font-weight:800">1 850 / 2 300 kcal</div><p class="muted">P 122 / 170 · H 132 / 230 · R 38 / 75</p><button class="btn light" onclick="go('food')">Avaa ravinto</button>`)}${C(`<h3>Paino</h3><div style="font-size:28px;font-weight:800">${db.clients[0].weight} kg</div><button class="btn light" onclick="go('progress')">Katso kehitys</button>`)}`;return `<div class="eyebrow">VALMENTAJA</div><h1>Hyvää päivää!</h1><p class="sub">BUILT V1.1 · valmennuksen työtila</p>${C(`<div class="grid"><div class="stat"><div class="small muted">Asiakkaita</div><b>${db.clients.length}</b></div><div class="stat"><div class="small muted">Treenipankki</div><b>${db.library.length}</b></div></div>`)}${C(`<h3>Asiakkaiden kehitys</h3>${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.weight} kg · tavoite ${x.goalWeight} kg</div></div><button class="btn small p" onclick="selected=${x.id};go('client')">Avaa</button></div>`).join("")}`)}<button class="btn p" onclick="go('clients')">Avaa asiakkaat</button>`}
function clients(){return `<div class="eyebrow">VALMENTAJA</div><h1>Asiakkaat</h1><p class="sub">${db.clients.length} aktiivista asiakasta</p>${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.weight} kg · ${x.goal}</div></div><button class="btn small" onclick="selected=${x.id};go('client')">Avaa</button></div>`).join("")}<button class="btn p" onclick="modal='client';render()">+ Lisää asiakas</button>`}
function client(){let x=db.clients.find(a=>a.id===selected);return `<div class="eyebrow">ASIAKAS</div><h1>${x.name}</h1><p class="sub">${x.goal} · ${x.weight} kg → ${x.goalWeight} kg</p>${C(`<div class="grid"><div class="stat"><div class="small muted">BMR</div><b>${bmr(x)} kcal</b></div><div class="stat"><div class="small muted">TDEE</div><b>${tdee(x)} kcal</b></div><div class="stat"><div class="small muted">Paino</div><b>${x.weight} kg</b></div><div class="stat"><div class="small muted">Tavoite</div><b>${x.goalWeight} kg</b></div></div>`)}${C(`<div class="row"><div><h3>Edistyminen</h3><div class="muted small">Painokehitys ja tavoite</div></div><button class="btn small p" onclick="go('progress')">Avaa</button></div><div class="chart"><canvas id="coachChart"></canvas></div>`)}${C(`<div class="row"><div><h3>Harjoitusohjelma</h3><div class="muted small">${x.workouts.length} harjoitusta</div></div><button class="btn small p" onclick="modal='workout';render()">+ Lisää</button></div>`)}${x.workouts.map(w=>`<div class="item"><h3>${w.name}</h3><div class="muted small">${w.tags} · ${w.ex.length} liikettä</div></div>`).join("")}${C(`<div class="row"><div><h3>Ravinto-ohjelma</h3><div class="muted small">${x.diet?x.diet.kcal+" kcal · P "+x.diet.p+" g · H "+x.diet.c+" g · R "+x.diet.f+" g":"Ei määritetty"}</div></div><button class="btn small p" onclick="modal='diet';render()">Muokkaa</button></div>`)}${C(`<h3>Muistiinpanot</h3><p class="muted">${x.notes||"Ei muistiinpanoja."}</p>`)}`}
function drawChart(canvas,x){if(!canvas)return;let ctx=canvas.getContext("2d"),d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;ctx.scale(d,d);let v=x.weights||[x.weight],min=Math.min(...v,x.goalWeight)-1,max=Math.max(...v)+1,p=28,px=i=>p+i*(w-2*p)/Math.max(1,v.length-1),py=a=>h-p-(a-min)/(max-min)*(h-2*p);ctx.strokeStyle="#ddd";for(let i=0;i<4;i++){let y=p+i*(h-2*p)/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}ctx.strokeStyle="#7440d8";ctx.lineWidth=3;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(px(i),py(a)):ctx.moveTo(px(i),py(a)));ctx.stroke();ctx.fillStyle="#7440d8";v.forEach((a,i)=>{ctx.beginPath();ctx.arc(px(i),py(a),4,0,7);ctx.fill()});ctx.strokeStyle="#268a52";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(p,py(x.goalWeight));ctx.lineTo(w-p,py(x.goalWeight));ctx.stroke();ctx.setLineDash([])}
function progress(){let x=db.clients.find(a=>a.id===selected)||db.clients[0];return `<div class="eyebrow">SEURANTA</div><h1>${role==="coach"?x.name:"Kehitys"}</h1><p class="sub">Painokehitys · tavoite ${x.goalWeight} kg</p>${C(`<div class="grid"><div class="stat"><div class="small muted">Nykyinen</div><b>${x.weight} kg</b></div><div class="stat"><div class="small muted">Muutos</div><b>${((x.weights?.[0]||x.weight)-x.weight).toFixed(1)} kg</b></div></div>`)}${C(`<div class="row"><div><h3>Painon kehitys</h3><div class="muted small">Viikkopisteet</div></div><span class="badge">Tavoite ${x.goalWeight} kg</span></div><div class="chart"><canvas id="progressChart"></canvas></div>`)}${role==="coach"?C(`<h3>Valmentajan yhteenveto</h3><p class="muted small">Tämä näkymä on tarkoitettu nopeaan viikkoseurantaan. Seuraavaksi voidaan lisätä myös vyötärö, kuvat, voimatasot ja treenien suoritusprosentti.</p>`):""}`}
function programs(){return `<div class="eyebrow">VALMENTAJA</div><h1>Ohjelmat</h1><p class="sub">Rakenna asiakkaalle viikko tai käytä pankkia.</p>${db.clients.map(x=>`<div class="item row"><div><h3>${x.name}</h3><div class="muted small">${x.workouts.length} harjoitusta</div></div><button class="btn small p" onclick="selected=${x.id};modal='workout';render()">+ Treeni</button></div>`).join("")}`}
function library(){return `<div class="eyebrow">VALMENTAJA</div><h1>Treenipankki</h1><p class="sub">Rakenna kerran, käytä uudelleen.</p><button class="btn p" onclick="builder=[];modal='builder';render()">+ Luo harjoitus</button>${db.library.map((w,i)=>`<div class="item"><h3>${w.name}</h3><div class="muted small">${w.tags}</div><p class="small">${w.ex.map(e=>e[0]+" · "+e[1]+"×"+e[2]).join(" · ")}</p><button class="btn light" onclick="applyIndex=${i};modal='apply';render()">Käytä asiakkaalle</button></div>`).join("")}`}
function workout(){let w=db.library[0];return `<div class="eyebrow">TREENI</div><h1>${w.name}</h1><p class="sub">Tämän päivän harjoitus</p>${w.ex.map((e,i)=>`<div class="item row"><div><h3>${i+1}. ${e[0]}</h3><div class="muted small">${e[1]} × ${e[2]} · lepo ${e[3]}</div>${e[4]?`<div class="small">${e[4]}</div>`:""}</div><button class="btn small" onclick="this.textContent=this.textContent==='✓'?'Tehty':'✓'">✓</button></div>`).join("")}<button class="btn p" onclick="alert('Treeni merkitty tehdyksi!')">Lopeta treeni</button>`}
function food(){return `<div class="eyebrow">RAVINTO</div><h1>Ravinto</h1><p class="sub">Tämän päivän tavoitteet</p>${C(`<div class="grid"><div class="stat"><div class="small muted">Kalorit</div><b>2300</b></div><div class="stat"><div class="small muted">Proteiini</div><b>170 g</b></div><div class="stat"><div class="small muted">Hiilihydraatit</div><b>230 g</b></div><div class="stat"><div class="small muted">Rasva</div><b>75 g</b></div></div>`)}${["Aamiainen","Lounas","Välipala","Päivällinen"].map(x=>`<div class="item row"><div><h3>${x}</h3><div class="muted small">Ei ateriaa lisätty</div></div><button class="btn small p">+</button></div>`).join("")}`}
function messages(){return `<div class="eyebrow">KOMMUNIKAATIO</div><h1>Viestit</h1><p class="sub">Valmentaja ↔ asiakas</p>${C(`<div style="background:#eee;padding:11px;border-radius:15px;width:max-content">Treeniohjelma on päivitetty 💪</div><div style="background:#7440d8;color:#fff;padding:11px;border-radius:15px;width:max-content;margin:8px 0 8px auto">Kiitos! Katson sen tänään.</div>`)}<input placeholder="Kirjoita viesti…"><button class="btn">Lähetä</button>`}
function modalHtml(){if(!modal)return"";
if(modal==="builder")return `<div class="modal"><div class="sheet"><h2>Rakenna harjoitus</h2><label>Nimi</label><input id="bn" value="Uusi harjoitus"><label>Tunnisteet</label><input id="bt" placeholder="Alavartalo · Hypertrofia"><div>${builder.map((e,i)=>`<div class="ex"><div class="eg"><input value="${e[0]}" onchange="builder[${i}][0]=this.value"><input type="number" value="${e[1]}" onchange="builder[${i}][1]=this.value"><input value="${e[2]}" onchange="builder[${i}][2]=this.value"><input value="${e[3]}" onchange="builder[${i}][3]=this.value"><button class="btn small" onclick="builder.splice(${i},1);render()">×</button></div><label>Ohje</label><input value="${e[4]}" onchange="builder[${i}][4]=this.value" placeholder="Tekniikka / tempo / huomio"></div>`).join("")}</div><button class="btn light" onclick="builder.push(['Uusi liike',3,'8–12','90 s','']);render()">+ Lisää liike</button><button class="btn p" onclick="saveBuilder()">Tallenna Treenipankkiin</button><button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="client")return `<div class="modal"><div class="sheet"><h2>Lisää asiakas</h2><label>Nimi</label><input id="n"><label>Ikä</label><input id="age" type="number" value="30"><label>Sukupuoli</label><select id="sex"><option>Nainen</option><option>Mies</option></select><label>Pituus cm</label><input id="h" type="number" value="170"><label>Paino kg</label><input id="w" type="number" value="80"><label>Tavoitepaino kg</label><input id="gw" type="number" value="75"><label>Aktiivisuus</label><select id="act"><option>Kevyt</option><option selected>Kohtalainen</option><option>Korkea</option></select><label>Tavoite</label><select id="goal"><option>Painonpudotus</option><option>Painonhallinta</option><option>Lihasmassan kasvatus</option></select><button class="btn p" onclick="saveClient()">Tallenna</button><button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="workout")return `<div class="modal"><div class="sheet"><h2>Lisää harjoitus</h2>${db.library.map((w,i)=>`<div class="item row"><div><h3>${w.name}</h3><div class="muted small">${w.tags}</div></div><button class="btn small p" onclick="applyWorkout(${i})">Käytä</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="diet")return `<div class="modal"><div class="sheet"><h2>Ravinto-ohjelma</h2>${db.dietLibrary.map((d,i)=>`<div class="item row"><div><h3>${d.name}</h3><div class="muted small">P ${d.p} · H ${d.c} · R ${d.f}</div></div><button class="btn small p" onclick="applyDiet(${i})">Käytä</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`;
if(modal==="apply")return `<div class="modal"><div class="sheet"><h2>Käytä asiakkaalle</h2>${db.clients.map(x=>`<div class="item row"><h3>${x.name}</h3><button class="btn small p" onclick="selected=${x.id};applyWorkout(${applyIndex})">Lisää</button></div>`).join("")}<button class="btn light" onclick="modal='';render()">Peruuta</button></div></div>`}
function saveBuilder(){let n=document.getElementById("bn").value||"Uusi harjoitus",t=document.getElementById("bt").value||"Oma";db.library.push({name:n,tags:t,ex:builder.length?builder:[["Uusi liike",3,"8–12","90 s",""]]});save();modal="";page="library";render()}
function saveClient(){let x={id:Date.now(),name:document.getElementById("n").value||"Uusi asiakas",age:+age.value,sex:sex.value,height:+h.value,weight:+w.value,goalWeight:+gw.value,activity:act.value,goal:goal.value,notes:"",weights:[],workouts:[],diet:null};x.weights=[x.weight];db.clients.push(x);save();selected=x.id;modal="";page="clients";render()}
function applyWorkout(i){let x=db.clients.find(a=>a.id===selected);x.workouts.push(JSON.parse(JSON.stringify(db.library[i])));save();modal="";page="client";render()}
function applyDiet(i){let x=db.clients.find(a=>a.id===selected);x.diet={...db.dietLibrary[i]};save();modal="";page="client";render()}
function render(){let map=role==="coach"?{home,clients,client,programs,library,messages,progress}:{home,workout,food,progress,messages};main.innerHTML=(map[page]||home)()+modalHtml();nav();let x=db.clients.find(a=>a.id===selected)||db.clients[0];if(page==="client")drawChart(document.getElementById("coachChart"),x);if(page==="progress")drawChart(document.getElementById("progressChart"),x)}
const main=document.getElementById("main"),navEl=document.getElementById("nav"),roleBtn=document.getElementById("role");function drawChart(canvas,x){if(!canvas)return;let ctx=canvas.getContext("2d"),d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight,v=x.weights||[x.weight],min=Math.min(...v,x.goalWeight)-1,max=Math.max(...v)+1,p=28,px=i=>p+i*(w-2*p)/Math.max(1,v.length-1),py=a=>h-p-(a-min)/(max-min)*(h-2*p);canvas.width=w*d;canvas.height=h*d;ctx.scale(d,d);ctx.strokeStyle="#ddd";for(let i=0;i<4;i++){let y=p+i*(h-2*p)/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}ctx.strokeStyle="#7440d8";ctx.lineWidth=3;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(px(i),py(a)):ctx.moveTo(px(i),py(a)));ctx.stroke();ctx.fillStyle="#7440d8";v.forEach((a,i)=>{ctx.beginPath();ctx.arc(px(i),py(a),4,0,7);ctx.fill()});ctx.strokeStyle="#268a52";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(p,py(x.goalWeight));ctx.lineTo(w-p,py(x.goalWeight));ctx.stroke();ctx.setLineDash([])}
render();
</script></body></html>
