<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILT V1.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1050px;margin:auto;padding:18px 18px 105px}
.logo{font-size:29px;font-weight:900;margin-bottom:12px}.logo i{color:#7440d8;font-style:normal}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{display:flex;gap:5px;overflow-x:auto;padding:5px;background:#e9e9e6;border-radius:14px;position:sticky;top:8px;z-index:10}.nav button{white-space:nowrap;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:750;color:#666}.nav button.on{background:#fff;color:#7440d8;box-shadow:0 1px 4px #0001}
h1{font-size:30px;margin:18px 0 5px}h2,h3{margin:0 0 5px}.muted{color:#777}.small{font-size:12px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.12em;color:#777;margin-top:20px}
.card,.item,.program,.meal,.week,.day,.exercise{background:#fff;border:1px solid #e3e3df;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fafafa;border-radius:12px;padding:12px}.stat b{font-size:21px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:11px;background:#111;color:#fff;padding:10px 13px;font-weight:750;cursor:pointer}.btn.p{background:#7440d8}.btn.light{background:#eeeaf8;color:#5d31b4}.btn.danger{background:#f7eaea;color:#9a3333}.btn.small{padding:7px 9px;font-size:12px}.wide{width:100%;margin-top:8px}
input,select{width:100%;border:1px solid #d8d8d3;border-radius:10px;padding:10px;background:#fff;font:inherit}label{font-size:12px;color:#777;display:block;margin:9px 0 4px}
.search{margin:12px 0}.clientbar{display:flex;gap:6px;overflow-x:auto;padding:5px 0}.clientpill{white-space:nowrap;border:1px solid #ddd;border-radius:99px;padding:8px 12px;background:#fff}.clientpill.on{background:#7440d8;color:#fff;border-color:#7440d8}
.chart{height:230px;background:#fafafa;border:1px solid #ddd;border-radius:14px}.chart canvas{width:100%;height:100%}.macro{display:flex;gap:6px;flex-wrap:wrap}.macro span{background:#f1eef9;color:#5d31b4;border-radius:9px;padding:6px 9px;font-size:12px}
.modal{position:fixed;inset:0;background:#0005;z-index:30;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:820px;margin:auto;border-radius:22px 22px 0 0;padding:19px;max-height:94vh;overflow:auto}
.eg{display:grid;grid-template-columns:1.5fr .5fr .7fr .7fr .7fr auto;gap:5px}.eg input{padding:8px;font-size:13px}.mealgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:650px){.grid,.mealgrid{grid-template-columns:1fr}.app{padding:12px 12px 100px}.nav button{font-size:11px}.eg{grid-template-columns:1.4fr .5fr .65fr .65fr auto}.eg input:nth-child(5){display:none}}
</style>
</head>
<body><div class="app"><div class="top"><div class="logo">BUILT<i>.</i></div><button class="btn light small" onclick="toggleRole()">Valmentaja / Asiakas</button></div><div class="nav" id="nav"></div><main id="main"></main></div>
<script>
const seed={
clients:[
{id:1,name:"Emma",weight:82.4,goalWeight:78,weights:[84.2,83.7,83.1,82.8,82.4,81.9,81.6],adherence:92,programs:[101],diet:201},
{id:2,name:"Mika",weight:91.2,goalWeight:86,weights:[92.8,92.2,91.8,91.2],adherence:84,programs:[102],diet:202},
{id:3,name:"Laura",weight:67.8,goalWeight:70,weights:[66.5,67.1,67.8],adherence:96,programs:[],diet:null}],
programs:[
{id:101,name:"4 viikon perusohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[{name:"Alavartalo A",ex:[["Kyykky",4,"6–8","","120 s","Pidä keskivartalo tiukkana."],["Romanialainen maastaveto",3,"8–10","","120 s",""],["Hip thrust",4,"8–12","","90 s",""]]}]},{name:"Viikko 2",days:[]},{name:"Viikko 3",days:[]},{name:"Viikko 4",days:[]}]},
{id:102,name:"Voima 3x viikko",goal:"Voima",weeks:[{name:"Viikko 1",days:[{name:"Koko kroppa",ex:[["Takakyykky",5,"5","","150 s",""],["Penkkipunnerrus",4,"6","","120 s",""],["Kulmasoutu",4,"8","","90 s",""]]}]}]}],
library:[{id:301,name:"Alavartalo A",ex:[["Kyykky",4,"6–8","","120 s",""],["Romanialainen maastaveto",3,"8–10","","120 s",""]]}],
diets:[
{id:201,name:"2300 kcal · Painonpudotus",kcal:2300,p:170,c:230,f:75,meals:[{name:"Aamiainen",foods:[["Kaurapuuro",60,"g"],["Banaani",1,"kpl"],["Rahka",200,"g"]]},{name:"Lounas",foods:[["Kana",150,"g"],["Riisi",100,"g"],["Kasvikset",200,"g"]]},{name:"Välipala",foods:[["Ruisleipä",2,"kpl"],["Kananmuna",2,"kpl"]]}]},
{id:202,name:"2700 kcal · Ylläpito",kcal:2700,p:180,c:300,f:80,meals:[{name:"Aamiainen",foods:[["Kaurapuuro",80,"g"],["Rahka",250,"g"],["Marjat",100,"g"]]},{name:"Lounas",foods:[["Kana",200,"g"],["Riisi",150,"g"],["Kasvikset",200,"g"]]}]}],
meals:[
{id:401,name:"Proteiinipuuro + banaani",type:"Aamiainen",kcal:520,p:35,c:72,f:10,foods:["Kaurapuuro 80 g","Rahka 200 g","Banaani 1 kpl"]},
{id:402,name:"Kana-riisikulho",type:"Lounas",kcal:610,p:48,c:72,f:12,foods:["Kana 180 g","Riisi 150 g","Kasvikset 200 g"]},
{id:403,name:"Jauheliha-peruna",type:"Päivällinen",kcal:640,p:45,c:60,f:22,foods:["Jauheliha 5 % 180 g","Peruna 300 g","Kasvikset 200 g"]},
{id:404,name:"Ruisleipä + kananmunat",type:"Välipala",kcal:390,p:25,c:42,f:14,foods:["Ruisleipä 2 kpl","Kananmunat 2 kpl","Kalkkuna 50 g"]},
{id:405,name:"Rahka-marjavälipala",type:"Välipala",kcal:300,p:30,c:30,f:4,foods:["Rahka 250 g","Marjat 150 g","Banaani 1/2 kpl"]},
{id:406,name:"Kana-wrap",type:"Lounas",kcal:570,p:44,c:55,f:18,foods:["Täysjyvätortilla 2 kpl","Kana 150 g","Kasvikset","Jogurttikastike"]}
]};
let db=JSON.parse(localStorage.getItem("built_v14")||"null")||seed,role="coach",page="dashboard",selected=1,editProgram=null,editDiet=null,modal="";
const $=id=>document.getElementById(id),save=()=>localStorage.setItem("built_v14",JSON.stringify(db)),client=()=>db.clients.find(x=>x.id===selected),prog=()=>db.programs.find(x=>x.id===editProgram),diet=()=>db.diets.find(x=>x.id===editDiet);
function go(p){page=p;modal="";render()} function toggleRole(){role=role==="coach"?"client":"coach";page=role==="coach"?"dashboard":"home";render()}
function nav(){let a=role==="coach"?[["dashboard","⌂","Dashboard"],["clients","♙","Asiakkaat"],["workouts","🏋","Harjoitukset"],["nutrition","🍎","Ravinto"],["library","▦","Treenipankki"],["messages","○","Viestit"]]:[["home","⌂","Koti"],["clientWorkout","🏋","Treeni"],["clientFood","🍎","Ravinto"],["progress","↗","Paino"],["messages","○","Viestit"]];$("nav").innerHTML=a.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join("")}
function card(x){return `<div class=card>${x}</div>`}
function clientStrip(){return `<div class=clientbar>${db.clients.map(x=>`<button class="clientpill ${x.id===selected?'on':''}" onclick="selected=${x.id};go('client')">${x.name}</button>`).join("")}</div>`}
function dashboard(){let x=client(),change=x.weights[0]-x.weight;return `<div class=eyebrow>VALMENTAJA</div><h1>Dashboard</h1>${clientStrip()}${card(`<div class=grid><div class=stat>Nykyinen paino<br><b>${x.weight} kg</b><br><small>Muutos ↓ ${change.toFixed(1)} kg</small></div><div class=stat>Tavoitepaino<br><b>${x.goalWeight} kg</b></div><div class=stat>Treeni<br><b>${x.adherence}%</b><br><small>toteutunut</small></div><div class=stat>Asiakas<br><b>${x.name}</b></div></div>`)}${card(`<h3>Painon kehitys</h3><div class=chart><canvas id=chart></canvas></div>`)}${card(`<div class=row><div><h3>Harjoitusohjelma</h3><div class=muted>${db.programs.find(p=>x.programs.includes(p.id))?.name||"Ei ohjelmaa"}</div></div><button class="btn p" onclick="go('workouts')">Muokkaa</button></div>`)}${card(`<div class=row><div><h3>Ravinto</h3><div class=muted>${db.diets.find(d=>d.id===x.diet)?.name||"Ei ruokavaliota"}</div></div><button class="btn p" onclick="go('nutrition')">Muokkaa</button></div>`)}`}
function clients(){return `<div class=eyebrow>VALMENTAJA</div><h1>Asiakkaat</h1><input class=search id=clientSearch placeholder="Hae asiakasta…" oninput="renderClients()"><div id=clientList></div><button class="btn p wide" onclick="modal='newClient';render()">+ Lisää asiakas</button>`}
function renderClients(){let q=($("clientSearch")?.value||"").toLowerCase(),arr=db.clients.filter(x=>x.name.toLowerCase().includes(q));$("clientList").innerHTML=arr.map(x=>`<div class=item><div class=row><div><h3>${x.name}</h3><div class=muted>${x.weight} kg → ${x.goalWeight} kg</div></div><button class=btn onclick="selected=${x.id};go('client')">Avaa</button></div></div>`).join("")||card("Asiakasta ei löytynyt.")}
function clientPage(){let x=client(),p=db.programs.find(p=>x.programs.includes(p.id)),d=db.diets.find(d=>d.id===x.diet);return `<div class=eyebrow>ASIAKAS</div><div class=row><h1>${x.name}</h1><div><button class="btn small" onclick="previousClient()">←</button> <button class="btn small" onclick="nextClient()">→</button></div></div>${clientStrip()}${card(`<div class=grid><div class=stat>Nykyinen<br><b>${x.weight} kg</b></div><div class=stat>Tavoite<br><b>${x.goalWeight} kg</b></div></div><button class="btn light wide" onclick="go('dashboard')">Avaa dashboard</button>`)}${card(`<div class=row><div><h3>Harjoitusohjelma</h3><div class=muted>${p?.name||"Ei ohjelmaa"}</div></div><button class="btn p" onclick="newClientProgram()">+ Ohjelma</button></div>${p?`<button class="btn light wide" onclick="editProgram=${p.id};modal='programEditor';render()">Muokkaa ohjelmaa</button>`:""}`)}${card(`<div class=row><div><h3>Ravinto</h3><div class=muted>${d?.name||"Ei ruokavaliota"}</div></div><button class="btn p" onclick="newClientDiet()">+ Ruokavalio</button></div>${d?`<button class="btn light wide" onclick="editDiet=${d.id};modal='dietEditor';render()">Muokkaa ruokavaliota</button>`:""}`)}${card(`<h3>Nopea siirtyminen</h3><button class="btn light" onclick="go('workouts')">🏋 Harjoitukset</button> <button class="btn light" onclick="go('nutrition')">🍎 Ravinto</button> <button class="btn light" onclick="go('progress')">📈 Paino</button>`)}`}
function previousClient(){let i=db.clients.findIndex(x=>x.id===selected);selected=db.clients[(i-1+db.clients.length)%db.clients.length].id;render()}function nextClient(){let i=db.clients.findIndex(x=>x.id===selected);selected=db.clients[(i+1)%db.clients.length].id;render()}
function workouts(){return `<div class=eyebrow>VALMENTAJA</div><h1>Harjoitukset</h1>${clientStrip()}<p class=muted>Ohjelmat asiakkaalle ${client().name}.</p><button class="btn p wide" onclick="newProgram()">+ Uusi ohjelma</button>${db.programs.map(p=>`<div class=program><div class=row><div><h3>${p.name}</h3><div class=muted>${p.goal} · ${p.weeks.length} viikkoa</div></div><button class=btn onclick="editProgram=${p.id};modal='programEditor';render()">Muokkaa</button></div><button class="btn light wide" onclick="assignProgram(${p.id})">Liitä ${client().name}:lle</button><button class="btn light wide" onclick="saveToLibrary(${p.id})">Tallenna Treenipankkiin</button></div>`).join("")}`}
function programEditor(){let p=prog();return `<div class=modal><div class=sheet><div class=row><h2>Muokkaa ohjelmaa</h2><button class="btn danger small" onclick="deleteProgram()">Poista</button></div><label>Ohjelman nimi</label><input id=pname value="${p.name}"><label>Tavoite</label><select id=pgoal><option>Hypertrofia</option><option>Voima</option><option>Olympianostot</option><option>Yleiskunto</option></select>${p.weeks.map((w,wi)=>`<div class=week><div class=row><b>${w.name}</b><button class="btn danger small" onclick="removeWeek(${wi})">Poista</button></div>${w.days.map((d,di)=>`<div class=day><div class=row><input value="${d.name}" onchange="dayName(${wi},${di},this.value)"><button class="btn danger small" onclick="removeDay(${wi},${di})">Poista</button></div>${d.ex.map((e,ei)=>`<div class=exercise><div class=eg><input value="${e[0]}" onchange="setEx(${wi},${di},${ei},0,this.value)"><input type=number value="${e[1]}" onchange="setEx(${wi},${di},${ei},1,this.value)"><input value="${e[2]}" onchange="setEx(${wi},${di},${ei},2,this.value)"><input value="${e[3]}" placeholder="kg" onchange="setEx(${wi},${di},${ei},3,this.value)"><input value="${e[4]}" placeholder="lepo" onchange="setEx(${wi},${di},${ei},4,this.value)"><button class="btn danger small" onclick="removeEx(${wi},${di},${ei})">×</button></div><input value="${e[5]}" placeholder="Valmentajan ohje" onchange="setEx(${wi},${di},${ei},5,this.value)"></div>`).join("")}<button class="btn light small" onclick="addEx(${wi},${di})">+ Liike</button></div>`).join("")}<button class="btn light small" onclick="addDay(${wi})">+ Treenipäivä</button></div>`).join("")}<button class="btn light wide" onclick="addWeek()">+ Viikko</button><button class="btn p wide" onclick="saveProgram()">Tallenna muutokset</button><button class="btn light wide" onclick="modal='';render()">Sulje</button></div></div>`}
function nutrition(){let d=client().diet?db.diets.find(x=>x.id===client().diet):null;return `<div class=eyebrow>VALMENTAJA</div><h1>Ravinto</h1>${clientStrip()}${card(`<h3>${client().name}: makrotavoite</h3><div class=grid><div class=stat>Kalorit<br><b>${d?.kcal||2500} kcal</b></div><div class=stat>Proteiini<br><b>${d?.p||180} g</b></div><div class=stat>Hiilihydraatit<br><b>${d?.c||250} g</b></div><div class=stat>Rasva<br><b>${d?.f||75} g</b></div></div>`)}<button class="btn p wide" onclick="newDiet()">+ Uusi ruokavalio</button>${d?card(`<div class=row><div><h3>${d.name}</h3><div class=muted>${d.meals.length} ateriaa</div></div><button class=btn onclick="editDiet=${d.id};modal='dietEditor';render()">Muokkaa</button></div>`):""}${card(`<h3>🍽️ Valmiit ateriat</h3><p class=muted>BUILT ehdottaa aterioita asiakkaan makrotavoitteen mukaan.</p><button class="btn p wide" onclick="go('mealBank')">Avaa ateriapankki</button>`)}`}
function mealBank(){let d=client().diet?db.diets.find(x=>x.id===client().diet):null,t=d||{p:180,c:250,f:75,kcal:2500};return `<div class=eyebrow>RAVINTO</div><h1>Ateriapankki</h1>${clientStrip()}${card(`<b>${client().name}</b><div class=muted>Valitse ateria, joka sopii jäljellä oleviin makroihin.</div>`)}${["Aamiainen","Lounas","Päivällinen","Välipala"].map(type=>`<h3 style="margin-top:18px">${type}</h3>${db.meals.filter(m=>m.type===type).map(m=>`<div class=meal"><div class=row><div><h3>${m.name}</h3><div class=macro><span>${m.kcal} kcal</span><span>P ${m.p} g</span><span>H ${m.c} g</span><span>R ${m.f} g</span></div></div><button class=btn p onclick="addMealToDiet(${m.id})">+ Lisää</button></div><div class=small style="margin-top:8px">${m.foods.join(" · ")}</div></div>`).join("")}`).join("")}<button class="btn light wide" onclick="go('nutrition')">← Takaisin ravintoon</button>`}
function workoutsDummy(){} 
function library(){return `<div class=eyebrow>VALMENTAJA</div><h1>Treenipankki</h1>${db.library.map(w=>`<div class=item><div class=row><div><h3>${w.name}</h3><div class=muted>${w.ex.length} liikettä</div></div><button class="btn danger small" onclick="db.library=db.library.filter(x=>x.id!==${w.id});save();render()">Poista</button></div></div>`).join("")||card("Treenipankki on tyhjä.")}`}
function messages(){return `<div class=eyebrow>KOMMUNIKAATIO</div><h1>Viestit</h1>${clientStrip()}${card(`<b>${client().name}</b><p class=muted>Treeniohjelma on päivitetty 💪</p>`)}<input placeholder="Kirjoita viesti…"><button class="btn p wide">Lähetä</button>`}`}
function home(){let x=client();return `<div class=eyebrow>ASIAKAS</div><h1>Hei ${x.name} 👋</h1>${card(`<h3>Tämän päivän treeni</h3><p class=muted>${db.programs.find(p=>x.programs.includes(p.id))?.name||"Ei treeniä"}</p><button class="btn p wide" onclick="go('clientWorkout')">Aloita treeni</button>`)}${card(`<h3>Paino</h3><h2>${x.weight} kg</h2><button class="btn light wide" onclick="go('progress')">Seuraa kehitystä</button>`)}`}
function clientWorkout(){let p=db.programs.find(p=>client().programs.includes(p.id)),d=p?.weeks[0]?.days[0];return `<div class=eyebrow>TREENI</div><h1>${d?.name||"Treeni"}</h1>${(d?.ex||[]).map((e,i)=>`<div class=item row><div><b>${i+1}. ${e[0]}</b><div class=muted>${e[1]} × ${e[2]} · ${e[4]}</div></div><button class=btn onclick="this.textContent='✓'">Tehty</button></div>`).join("")}`}
function clientFood(){let d=db.diets.find(d=>d.id===client().diet);return `<div class=eyebrow>RAVINTO</div><h1>${d?.name||"Ravinto"}</h1>${d?d.meals.map(m=>card(`<h3>${m.name}</h3>${m.foods.map(f=>`<div class=row><span>${f[0]}</span><span class=muted>${f[1]} ${f[2]}</span></div>`).join("")}`)).join(""):card("Ruokavaliota ei ole määritetty.")}`}
function progress(){let x=client();return `<div class=eyebrow>PAINO</div><h1>Painon kehitys</h1>${card(`<h2>${x.weight} kg</h2><div class=muted>Tavoite ${x.goalWeight} kg</div><div class=chart><canvas id=clientChart></canvas></div>`)} `}
function newProgram(){editProgram=Date.now();db.programs.push({id:editProgram,name:"Uusi ohjelma",goal:"Hypertrofia",weeks:[{name:"Viikko 1",days:[]} ]});client().programs.push(editProgram);save();modal="programEditor";render()}
function newClientProgram(){newProgram()}
function assignProgram(id){if(!client().programs.includes(id))client().programs.push(id);save();alert("Ohjelma liitetty "+client().name+"-asiakkaalle.")}
function addWeek(){prog().weeks.push({name:"Viikko "+(prog().weeks.length+1),days:[]});render()}function removeWeek(i){if(prog().weeks.length>1)prog().weeks.splice(i,1);render()}
function addDay(w){prog().weeks[w].days.push({name:"Uusi treeni",ex:[]});render()}function removeDay(w,d){prog().weeks[w].days.splice(d,1);render()}function dayName(w,d,v){prog().weeks[w].days[d].name=v}
function addEx(w,d){prog().weeks[w].days[d].ex.push(["Uusi liike",3,"8–12","","90 s",""]);render()}function removeEx(w,d,e){prog().weeks[w].days[d].ex.splice(e,1);render()}function setEx(w,d,e,k,v){prog().weeks[w].days[d].ex[e][k]=v}
function saveProgram(){prog().name=$("pname").value||"Ohjelma";prog().goal=$("pgoal").value;save();modal="";render()}function deleteProgram(){db.programs=db.programs.filter(p=>p.id!==editProgram);db.clients.forEach(c=>c.programs=c.programs.filter(id=>id!==editProgram));save();modal="";render()}
function saveToLibrary(id){let p=db.programs.find(x=>x.id===id),d=p.weeks[0]?.days[0];if(!d)return alert("Lisää ensin treenipäivä.");db.library.push({id:Date.now(),name:d.name,ex:JSON.parse(JSON.stringify(d.ex))});save();alert("Tallennettu Treenipankkiin.")}
function newDiet(){editDiet=Date.now();db.diets.push({id:editDiet,name:"Uusi ruokavalio",kcal:2500,p:180,c:250,f:75,meals:[]});client().diet=editDiet;save();modal="dietEditor";render()}
function newClientDiet(){newDiet()}
function addMealToDiet(id){let m=db.meals.find(x=>x.id===id);if(!client().diet){newDiet();}let d=db.diets.find(x=>x.id===client().diet);d.meals.push({name:m.name,foods:m.foods.map(x=>[x,1,"annos"])});save();alert("Ateria lisätty ruokavalioon.")}
function mealName(i,v){diet().meals[i].name=v}function addMeal(){diet().meals.push({name:"Uusi ateria",foods:[]});render()}function removeMeal(i){diet().meals.splice(i,1);render()}function addFood(i){diet().meals[i].foods.push(["Uusi ruoka",1,"kpl"]);render()}function removeFood(i,j){diet().meals[i].foods.splice(j,1);render()}function foodEdit(i,j,k,v){diet().meals[i].foods[j][k]=v}
function saveDiet(){let d=diet();d.name=$("dname").value||"Ruokavalio";d.kcal=+$("dk").value;d.p=+$("dp").value;d.c=+$("dc").value;d.f=+$("df").value;save();modal="";render()}function deleteDiet(){db.diets=db.diets.filter(d=>d.id!==editDiet);db.clients.forEach(c=>{if(c.diet===editDiet)c.diet=null});save();modal="";render()}
function saveClient(){let w=+$("cw").value,g=+$("cg").value;db.clients.push({id:Date.now(),name:$("cn").value||"Uusi asiakas",weight:w,goalWeight:g,weights:[w],adherence:0,programs:[],diet:null});save();modal="";render()}
function dietEditor(){let d=diet();return `<div class=modal><div class=sheet><div class=row><h2>Muokkaa ruokavaliota</h2><button class="btn danger small" onclick="deleteDiet()">Poista</button></div><label>Nimi</label><input id=dname value="${d.name}"><div class=grid><div><label>Kalorit</label><input id=dk type=number value="${d.kcal}"></div><div><label>Proteiini</label><input id=dp type=number value="${d.p}"></div><div><label>Hiilihydraatit</label><input id=dc type=number value="${d.c}"></div><div><label>Rasva</label><input id=df type=number value="${d.f}"></div></div>${d.meals.map((m,mi)=>`<div class=meal><div class=row><input value="${m.name}" onchange="mealName(${mi},this.value)"><button class="btn danger small" onclick="removeMeal(${mi})">Poista</button></div>${m.foods.map((f,fi)=>`<div class=item><div class=row><input value="${f[0]}" onchange="foodEdit(${mi},${fi},0,this.value)"><input style="max-width:80px" value="${f[1]}" onchange="foodEdit(${mi},${fi},1,this.value)"><span class=small>${f[2]}</span><button class="btn danger small" onclick="removeFood(${mi},${fi})">×</button></div></div>`).join("")}<button class="btn light small" onclick="addFood(${mi})">+ Ruoka</button></div>`).join("")}<button class="btn light wide" onclick="addMeal()">+ Ateria</button><button class="btn p wide" onclick="saveDiet()">Tallenna muutokset</button><button class="btn light wide" onclick="modal='';render()">Sulje</button></div></div>`}
function modalHtml(){if(modal==="programEditor")return programEditor();if(modal==="dietEditor")return dietEditor();if(modal==="newClient")return `<div class=modal><div class=sheet><h2>Lisää asiakas</h2><label>Nimi</label><input id=cn><label>Paino kg</label><input id=cw type=number value=80><label>Tavoitepaino kg</label><input id=cg type=number value=75><button class="btn p wide" onclick="saveClient()">Tallenna</button><button class="btn light wide" onclick="modal='';render()">Peruuta</button></div></div>`;return""}
function draw(id){let x=client(),v=x.weights,c=$(id);if(!c)return;let ctx=c.getContext("2d"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight,p=28,mn=Math.min(...v,x.goalWeight)-1,mx=Math.max(...v,x.goalWeight)+1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let px=i=>p+i*(w-2*p)/Math.max(1,v.length-1),py=a=>h-p-(a-mn)/(mx-mn)*(h-2*p);ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(p,h-p);ctx.lineTo(w-p,h-p);ctx.stroke();ctx.strokeStyle="#268a52";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(p,py(x.goalWeight));ctx.lineTo(w-p,py(x.goalWeight));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle="#7440d8";ctx.lineWidth=3;ctx.beginPath();v.forEach((a,i)=>i?ctx.lineTo(px(i),py(a)):ctx.moveTo(px(i),py(a)));ctx.stroke()}
function render(){let m=role==="coach"?{dashboard,clients,client:clientPage,workouts,nutrition,mealBank,library,messages}:{home,clientWorkout,clientFood,progress,messages};$("main").innerHTML=(m[page]||dashboard)()+modalHtml();nav();if(page==="clients")renderClients();if(page==="dashboard")draw("chart");if(page==="progress")draw("clientChart")}
render();
</script></body></html>
